# Mologate: the chat-container images (docs/container-nodes.md): the base image every chat
# container starts from, and the container node that runs them. Published to GHCR next to the app.
name: Container node and sandbox images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'containers/**'
      - '.github/workflows/container-images.yaml'
  push:
    branches:
      - main
      - dev
      - limits-and-accounts
    paths:
      - 'containers/**'
      - '.github/workflows/container-images.yaml'

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Open Terminal
        run: |
          version=$(sed -n 's/^ARG OPEN_TERMINAL_VERSION=//p' containers/sandbox/Dockerfile)
          pip install "open-terminal==$version"
      - name: Verify commands do not block file operations
        run: python -m unittest discover -s containers/sandbox/tests -v

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: containers/node
        run: pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: containers/node
        run: python -m pytest tests -q

  build:
    needs: [node-tests, sandbox-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: sandbox
            context: containers/sandbox
          - name: node
            context: containers/node
    steps:
      - name: Prepare environment
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.image.name }}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
