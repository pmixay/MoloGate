# Mologate: verify Phase 0 from outside the VPS.
name: Verify VPS hosting

on:
  workflow_dispatch:
  push:
    branches: [limits-and-accounts]
    paths:
      - 'deploy/vps/**'
      - '.github/workflows/vps-verify.yaml'

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify HTTPS and disabled signups
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          base = 'https://5-83-140-221.sslip.io'
          with urllib.request.urlopen(base + '/ready', timeout=30) as response:
              assert json.load(response)['status'] is True
          with urllib.request.urlopen(base + '/api/config', timeout=30) as response:
              assert json.load(response)['features']['enable_signup'] is False
          print('Public HTTPS readiness and signup settings passed.')
          PY

      # A SYN scan on this network reported nearly every port as open even
      # though the host has no such listeners. Use full TCP connections here;
      # audit all listeners and Docker firewall rules on the host as well.
      - name: Verify SSH and private service ports
        run: |
          python3 - <<'PYCODE'
          import concurrent.futures
          import socket

          host = '5.83.140.221'
          with socket.create_connection((host, 22), timeout=10) as connection:
              connection.settimeout(10)
              assert connection.recv(256).startswith(b'SSH-'), 'SSH banner missing'

          def probe(port):
              try:
                  with socket.create_connection((host, port), timeout=8):
                      return port
              except (ConnectionRefusedError, TimeoutError):
                  return None

          # Database, cache, app, proxy admin, common alternatives and controls.
          ports = [1, 81, 444, 2019, 3000, 5432, 6379, 8000, 8080, 8443, 9000, 27017, 65000]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              opened = [port for port in pool.map(probe, ports) if port is not None]
          assert not opened, f'Unexpected reachable TCP ports: {opened}'
          print('SSH verified; all 13 private/control TCP ports refused or filtered.')
          PYCODE

      - name: Install port scanner
        run: |
          if ! command -v nmap >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nmap
          fi

      - name: Verify all public TCP ports with completed connections
        run: |
          nmap -n -Pn -sT -T4 --max-retries 1 --min-rate 500 --max-rate 1000 \
            -p- -oX "$RUNNER_TEMP/mologate-ports.xml" 5.83.140.221 \
            >"$RUNNER_TEMP/mologate-scan.log" 2>&1
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          result = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'mologate-ports.xml')
          opened = {
              int(port.attrib['portid'])
              for port in result.findall('.//port')
              if port.find('state').attrib['state'] == 'open'
          }
          assert opened == {22, 80, 443}, (
              f'Found {len(opened)} open TCP ports; first 30: {sorted(opened)[:30]}'
          )
          print('Full external TCP scan passed: only 22, 80 and 443 are open.')
          PY
