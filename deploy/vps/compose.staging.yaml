name: mologate-staging

services:
  mologate:
    image: ${IMAGE:-ghcr.io/pmixay/mologate:limits-and-accounts-slim}
    mem_limit: 768m
    networks:
      edge:
        aliases: !override [mologate-staging]
  postgres:
    mem_limit: 256m
  redis:
    mem_limit: 96m
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
  caddy:
    # Production's Caddy serves staging too. No second set of public ports.
    profiles: [standalone-proxy]
